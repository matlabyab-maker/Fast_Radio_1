name: Build Fast Radio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          {
            echo "=== Fast Radio Build Log ==="
            echo "Date (UTC): $(date -u)"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "=== Java ==="
            java -version
            echo ""
            echo "=== Gradle ==="
            gradle --version
            echo ""
            echo "=== BUILD START ==="
          } > build.log 2>&1

          gradle --no-daemon :app:assembleDebug --stacktrace --info >> build.log 2>&1
          STATUS=$?

          {
            echo ""
            echo "=== APK FILES ==="
            find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
            echo ""
            echo "BUILD EXIT CODE: $STATUS"
            echo "=== BUILD END ==="
          } >> build.log 2>&1

          exit $STATUS

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
