name: Build Fast Radio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and create Log
        run: |
          set +e
          echo "=== Fast Radio Build Log ===" > build.log
          echo "Date: $(date -u)" >> build.log
          echo "Commit: $GITHUB_SHA" >> build.log
          gradle assembleDebug --stacktrace --info >> build.log 2>&1
          STATUS=$?
          echo "BUILD EXIT CODE: $STATUS" >> build.log
          find . -type f -name "*.apk" -print >> build.log || true
          exit $STATUS

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-Build-Log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-APK
          path: "**/*.apk"
